services:
  dock-ionos-bridge:
    build:
      context: .
    container_name: dock-ionos-bridge
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - imap_password
      - n8n_header
    volumes:
      - ./data:/app/data
    networks:
      - root_default
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

  dock-ionos-smtp:
    build:
      context: .
    container_name: dock-ionos-smtp
    command: ["node", "src/smtp-server.mjs"]
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - imap_password
      - n8n_header
    volumes:
      - ./smtp-data:/app/smtp-data
    networks:
      - root_default
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test: ["CMD", "node", "src/smtp-healthcheck.mjs"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  dock-ionos-imap:
    build:
      context: .
    container_name: dock-ionos-imap
    command: ["node", "src/imap-server.mjs"]
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - imap_password
      - n8n_header
    volumes:
      - ./data:/app/data
    networks:
      - root_default
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test: ["CMD", "node", "src/imap-healthcheck.mjs"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

networks:
  root_default:
    external: true
    name: root_default

secrets:
  imap_password:
    file: /root/.dock-ionos-secrets/imap_password
  n8n_header:
    file: /root/.dock-ionos-secrets/n8n_header
